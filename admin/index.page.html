locked: true
-->
<page title="Games - Admin">
<content>
  <script type="module" src="/kempo/components/Permission.js"></script>
  <script type="module" src="/kempo-ui/components/Icon.js"></script>
  <script type="module" src="/kempo-ui/components/Table.js"></script>
  <script type="module" src="/kempo-ui/components/controls/TcFirstPage.js"></script>
  <script type="module" src="/kempo-ui/components/controls/TcPrevPage.js"></script>
  <script type="module" src="/kempo-ui/components/controls/TcNextPage.js"></script>
  <script type="module" src="/kempo-ui/components/controls/TcLastPage.js"></script>
  <script type="module" src="/kempo-ui/components/controls/TcPageSelect.js"></script>
  <script type="module" src="/kempo-ui/components/controls/TcPageSize.js"></script>
  <script type="module" src="/admin/extension/kempo-game/components/GameDelete.js"></script>

  <div class="p">
    <h1>Games</h1>
    <p class="tc-muted">
      Every game on the site, whichever game extension it belongs to. A game is <strong>running</strong>
      while someone is connected to it on the process that answered this request, and is saved on a timer,
      when its owner asks, and when the last player leaves. Deleting one removes it for everyone in it.
    </p>

    <k-permission has="game:admin">
      <p id="status" class="tc-muted">Loading…</p>
      <k-table id="games" style="display: none;" placeholder="There are no games yet.">
        <k-game-delete slot="after"></k-game-delete>
      </k-table>
    </k-permission>
  </div>

  <script type="module">
    import Dialog from '/kempo-ui/components/Dialog.js';
    import { listAllGames, deleteGame } from '/game/sdk.js';

    const status = document.getElementById('status');
    const table = document.getElementById('games');

    const fields = [
      { name: 'name', label: 'Name', editable: false },
      { name: 'type', label: 'Type', size: 160, editable: false },
      { name: 'playerCount', label: 'Players', size: 100, editable: false, calculator: game => String(game.playerCount) },
      { name: 'savedAt', label: 'Last saved', size: 200, editable: false, calculator: game => game.savedAt ? new Date(game.savedAt).toLocaleString() : 'Never' },
      { name: 'live', label: 'Running', size: 110, editable: false, calculator: game => game.live ? 'Yes' : 'No' },
    ];

    const load = async () => {
      const [error, data] = await listAllGames();
      if(error){
        status.textContent = error.code === 403 ? 'You need the game:admin permission to see this.' : error.msg;
        table.style.display = 'none';
        return;
      }

      table.setData({ records: data.games, fields });
      status.textContent = data.games.length ? '' : 'There are no games yet.';
      table.style.display = data.games.length ? '' : 'none';
    };

    table.addEventListener('gameDelete', ({ detail: { record: game } }) => {
      Dialog.confirm(`Delete "${game.name}"? It is removed for everyone in it.`, async confirmed => {
        if(!confirmed) return;
        const [deleteError] = await deleteGame(game.id);
        if(deleteError) status.textContent = deleteError.msg;
        await load();
      });
    });

    await load();
  </script>
</content>
</page>
